[tool.poetry]
name = "marina-photo-bot"
version = "0.1.0"
description = "Telegram bot for Marina Photo"
authors = ["Denis <denlifik@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
aiogram = ">=3.25.0"
pydantic = ">=2.10.0"
pydantic-settings = ">=2.6.1"
httpx = ">=0.28.1"
python-dotenv = ">=1.0.1"
pillow = ">=11.0.0"
supabase = ">=2.10.0"
postgrest = ">=0.18.0"
storage3 = ">=0.9.0"
gotrue = ">=2.11.0"
fastapi = ">=0.115.0"
uvicorn = {version = ">=0.32.0", extras = ["standard"]}
python-multipart = ">=0.0.20"
python-jose = {version = ">=3.3.0", extras = ["cryptography"]}
aiofiles = ">=24.1.0"
reportlab = ">=4.2.5"


[tool.poetry.group.dev.dependencies]
ruff = ">=0.8.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dist", ".venv"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "C4",            # comprehensions
    "RUF",
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI uses Depends() as default
    "RUF001", "RUF002", "RUF003",  # cyrillic letters in strings are intentional
]

[tool.ruff.lint.per-file-ignores]
"app/bot/runtime/preview.py" = ["E501"]
"app/bot/runtime/blocks.py" = ["BLE001", "E501"]
"app/bot/runtime/engine.py" = ["BLE001", "SLF001"]
"app/bot/runtime/pdf.py" = ["BLE001"]
